seed_devices:
  name: Задать состав устройств
  description: >-
    Задать состав бризеров вручную, когда облако недоступно и интеграция не
    успела его запомнить. Нужны те же сведения, что пришли бы из облака:
    облачный id устройства и его MAC. Обычно не требуется — состав
    запоминается сам при первом удачном опросе облака.
  fields:
    devices:
      name: Устройства
      description: >-
        Список устройств. У каждого обязательны id (облачный идентификатор)
        и mac; можно добавить name, model, fw_ver.
      required: true
      example: >-
        [{"id": 12746, "mac": "B0:A7:32:5A:79:BC", "name": "Бризер спальня"},
         {"id": 17428, "mac": "84:1F:E8:A5:D7:A0", "name": "Бризер"}]
      selector:
        object:
